server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  location /api/ {
    # Plain hostname works in Docker Compose (service name) and in K8s (cluster DNS).
    # Do not use 127.0.0.11 + variable proxy_pass here — that targets Docker's DNS and can hang in K8s.
    proxy_pass http://backend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}