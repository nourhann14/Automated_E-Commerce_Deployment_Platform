<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Ecommerce</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <div class="brand">Simple Ecommerce</div>
        <nav class="nav">
          <a href="#products">Products</a>
          <a href="#add">Add product</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>3‑tier demo: HTML/CSS → Express API → MySQL</h1>
        <p>Open this page from the backend server (it serves the static frontend).</p>
        <div class="hero__status">
          <span class="pill" id="healthPill">Checking API…</span>
        </div>
      </section>

      <section id="add" class="card">
        <h2>Add product</h2>
        <form id="addForm" class="form">
          <label>
            <span>Name</span>
            <input name="name" required maxlength="200" placeholder="e.g. Headphones" />
          </label>
          <label>
            <span>Description</span>
            <textarea name="description" rows="3" placeholder="Optional"></textarea>
          </label>
          <label>
            <span>Price (USD)</span>
            <input name="price" required inputmode="decimal" placeholder="e.g. 19.99" />
          </label>
          <label>
            <span>Image URL</span>
            <input name="image_url" placeholder="Optional image URL" />
          </label>
          <div class="form__actions">
            <button type="submit" class="btn">Create</button>
            <span class="muted" id="formMsg"></span>
          </div>
        </form>
      </section>

      <section id="products" class="section">
        <div class="section__header">
          <h2>Products</h2>
          <button class="btn btn--ghost" id="refreshBtn" type="button">Refresh</button>
        </div>
        <div class="grid" id="productsGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="muted">Node 18 + Express + MySQL</span>
      </div>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
