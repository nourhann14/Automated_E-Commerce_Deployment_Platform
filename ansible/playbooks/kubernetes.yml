---
- name: Setup Kubernetes VM (k3s + MongoDB + Backend + Frontend)
  hosts: kubernetes
  become: yes

  vars:
    k3s_version: "v1.29.4+k3s1"
    manifest_dir: /home/ubuntu/manifests
    mongo_uri: mongodb+srv://nourhan_14:depi2026@cluster1.2mcjegp.mongodb.net/?test=Cluster1

  tasks:

    # ───────────────────────────────
    # INSTALL BASICS
    # ───────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - curl
          - open-iscsi
          - netcat-openbsd    # needed by init container wait script
        state: present

    # ───────────────────────────────
    # INSTALL K3S
    # ───────────────────────────────
    - name: Check if k3s is already installed
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install k3s
      when: not k3s_binary.stat.exists
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          sh -s - server \
          --write-kubeconfig-mode 644 \
          --node-name kubernetes
      args:
        executable: /bin/bash

    - name: Enable and start k3s
      systemd:
        name: k3s
        enabled: yes
        state: started

    # ───────────────────────────────
    # WAIT FOR CLUSTER TO BE READY
    # ───────────────────────────────
    - name: Wait for node to be Ready
      command: k3s kubectl get node kubernetes --no-headers
      register: node_status
      until: "'Ready' in node_status.stdout"
      retries: 20
      delay: 10
      changed_when: false

    # ───────────────────────────────
    # MANIFEST DIRECTORY
    # ───────────────────────────────
    - name: Create manifests folder
      file:
        path: "{{ manifest_dir }}"
        state: directory
        mode: "0755"

    # ───────────────────────────────
    # MONGODB
    # ───────────────────────────────
    - name: Write MongoDB manifest
      copy:
        dest: "{{ manifest_dir }}/mongodb.yaml"
        mode: "0644"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mongodb
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mongodb
            template:
              metadata:
                labels:
                  app: mongodb
              spec:
                containers:
                  - name: mongodb
                    image: mongo:6
                    ports:
                      - containerPort: 27017
                    volumeMounts:
                      - name: mongo-data
                        mountPath: /data/db
                    readinessProbe:
                      tcpSocket:
                        port: 27017
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      failureThreshold: 10
                volumes:
                  - name: mongo-data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mongodb
          spec:
            selector:
              app: mongodb
            ports:
              - port: 27017
                targetPort: 27017

    # ───────────────────────────────
    # BACKEND
    # ───────────────────────────────
    - name: Write Backend manifest
      copy:
        dest: "{{ manifest_dir }}/backend.yaml"
        mode: "0644"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
              spec:
                initContainers:
                  - name: wait-for-mongo
                    image: busybox
                    command:
                      - sh
                      - -c
                      - |
                        echo "Waiting for MongoDB to be ready..."
                        until nc -z mongodb 27017; do
                          echo "MongoDB not ready yet, retrying in 2s..."
                          sleep 2
                        done
                        echo "MongoDB is up!"
                containers:
                  - name: backend
                    image: nourhan14/mern-amazona-backend:latest
                    ports:
                      - containerPort: 4000
                    env:
                      - name: MONGODB_URI
                        value: "mongodb://mongodb:27017/amazona"
                      - name: NODE_ENV
                        value: "production"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend
          spec:
            selector:
              app: backend
            ports:
              - port: 4000
                targetPort: 4000

    # ───────────────────────────────
    # FRONTEND
    # ───────────────────────────────
    - name: Write Frontend manifest
      copy:
        dest: "{{ manifest_dir }}/frontend.yaml"
        mode: "0644"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                initContainers:
                  - name: wait-for-backend
                    image: busybox
                    command:
                      - sh
                      - -c
                      - |
                        echo "Waiting for Backend to be ready..."
                        until nc -z backend 4000; do
                          echo "Backend not ready yet, retrying in 2s..."
                          sleep 2
                        done
                        echo "Backend is up!"
                containers:
                  - name: frontend
                    image: nourhan14/mern-amazona-frontend:latest
                    ports:
                      - containerPort: 80
                    env:
                      - name: REACT_APP_BACKEND_URL
                        value: "http://backend:4000"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend
          spec:
            type: NodePort
            selector:
              app: frontend
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30000

    # ───────────────────────────────
    # APPLY ALL MANIFESTS
    # ───────────────────────────────
    - name: Apply MongoDB
      command: k3s kubectl apply -f {{ manifest_dir }}/mongodb.yaml

    - name: Wait for MongoDB pod to be ready
      command: k3s kubectl wait --for=condition=ready pod -l app=mongodb --timeout=120s
      register: mongo_wait
      retries: 3
      delay: 10

    - name: Apply Backend
      command: k3s kubectl apply -f {{ manifest_dir }}/backend.yaml

    - name: Apply Frontend
      command: k3s kubectl apply -f {{ manifest_dir }}/frontend.yaml

    # ───────────────────────────────
    # DEBUG OUTPUT
    # ───────────────────────────────
    - name: Get all pods
      command: k3s kubectl get pods -o wide
      register: pods
      changed_when: false

    - name: Get all services
      command: k3s kubectl get services
      register: services
      changed_when: false

    - debug:
        var: pods.stdout_lines

    - debug:
        var: services.stdout_lines

    - debug:
        msg: "✅ Frontend available at: http://{{ ansible_host }}:30000"